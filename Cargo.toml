[package]
name = "sq-lite"
version = "0.1.0"
edition = "2021"     
build = "build.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tower-http = { version = "0.5", features = ["fs"] }

[build-dependencies]
tauri-winres = "0.1"